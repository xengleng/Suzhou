name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libfontconfig-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: suzhou-x86_64-linux
          path: target/release/suzhou
