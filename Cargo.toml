[package]
name = "suzhou"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A desktop client for a team of always-on Bots, built with Rust and Zed's GPUI"
license = "MIT"
repository = "https://github.com/xengleng/Suzhou"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# GPUI is heavy; optimise dependencies even in dev builds so animations stay smooth.
[profile.dev.package."*"]
opt-level = 2
